<section class="hero relative isolate flex flex-col overflow-hidden bg-slate-950 text-white"
  aria-roledescription="carousel" [attr.aria-label]="'dashboard.hero.carouselLabel' | transloco"
  (mouseenter)="setInteracting(true)" (mouseleave)="setInteracting(false)" (focusin)="setInteracting(true)"
  (focusout)="setInteracting(false)">

  <div class="absolute inset-0 -z-10">
    @for (slide of slides; track slide.image; let i = $index) {
    <div class="hero-slide" [class.is-active]="activeIndex() === i" [attr.aria-hidden]="activeIndex() !== i">
      <img class="hero-image" [src]="src(slide)" [attr.srcset]="srcset(slide)" sizes="100vw"
        [style.object-position]="slide.focus" [attr.alt]="slide.altKey | transloco"
        [attr.fetchpriority]="i === 0 ? 'high' : 'low'" [attr.loading]="i === 0 ? 'eager' : 'lazy'" decoding="async"
        width="1920" height="1080" />
      <div class="hero-overlay" [class]="'overlay-' + slide.overlay"></div>
    </div>
    }
  </div>

  <div
    class="relative z-10 mx-auto flex w-full max-w-7xl flex-1 flex-col items-center justify-center px-6 pb-12 pt-16 text-center sm:px-8 lg:px-10 lg:pb-16">
    <h1 class="max-w-4xl text-balance text-4xl font-bold leading-[1.08] tracking-tight sm:text-5xl lg:text-6xl">
      {{ 'dashboard.hero.title' | transloco }}
    </h1>

    <p class="mt-6 max-w-2xl text-balance text-base leading-8 text-white/85 sm:text-lg">
      {{ 'dashboard.hero.subtitle' | transloco }}
    </p>

    <div class="mt-10">
      <app-free-call-cta [label]="'dashboard.hero.heroCtaLabel' | transloco" [confirmedLabel]="'common.ctaConfirmed' | transloco"
        analyticsLabel="hero_free_call" variant="light" size="lg" />
    </div>

    <p class="mt-4 text-xs font-medium uppercase tracking-[0.2em] text-white/60">
      {{ 'dashboard.hero.ctaNote' | transloco }}
    </p>
  </div>

  <div class="relative z-10 mx-auto flex w-full max-w-7xl justify-center px-6 pb-8 sm:px-8 lg:px-10">
    <a class="hero-scroll-cue inline-flex h-11 w-11 items-center justify-center rounded-full border border-white/30 text-white/80 transition hover:border-white hover:text-white"
      href="javascript:void(0)" [attr.aria-label]="'dashboard.hero.ctaSecondary' | transloco"
      (click)="scrollToElement('hero-next'); trackCta('hero_view_protocol')">
      <svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.8"
        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 5v14M6 13l6 6 6-6" />
      </svg>
    </a>
  </div>
</section>
