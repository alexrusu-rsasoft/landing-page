<section id="calendar">
  <h1 class="sr-only">{{ 'meta.calendar' | transloco }}</h1>
  <!-- Google Calendar Appointment Scheduling begin -->
  <iframe #calendarIframe
    [src]="calendarSrc()"
    frameborder="0" [title]="'common.calendarIframeTitle' | transloco" [style.height]="'200vh'" width="100%"
    (load)="onCalendarLoad()"></iframe>
  <!-- end Google Calendar Appointment Scheduling -->
</section>
