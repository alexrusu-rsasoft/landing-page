<!-- Certifications -->
<div class="flex flex-wrap justify-evenly gap-6">
  @for (cert of certifications; track cert.name) {
  <div
    class="cert-card rounded-2xl sm:rounded-3xl flex flex-col justify-between flex-1 min-w-[260px] max-w-sm bg-white p-6 shadow-sm shadow-slate-200/70 border border-slate-100/80 hover:border-slate-300 transition-all duration-300 cursor-pointer"
    (mouseenter)="showCert(cert, $event)" (mouseleave)="hideCert()" (focus)="showCert(cert, $event)" (blur)="hideCert()"
    (keydown.escape)="hideCert()" tabindex="0" role="button">
    <div class="flex items-start gap-4 overflow-hidden">
      <div
        class="p-3 rounded-2xl bg-slate-50 border border-slate-100 flex items-center justify-center shrink-0 text-slate-900 font-semibold text-lg"
        aria-hidden="true">
        ✓
      </div>
      <div class="min-w-0">
        <h3 class="text-lg font-bold text-slate-950 leading-snug">
          {{ cert.name }}
        </h3>
        <p class="text-sm text-slate-500 mt-1">{{ cert.issuer }}</p>
        <p class="text-xs text-slate-600 font-mono mt-1.5">{{ cert.year }}</p>
      </div>
    </div>

    @if (cert.credentialUrl) {
    <a [href]="cert.credentialUrl" target="_blank" rel="noopener noreferrer"
      class="inline-flex min-h-6 items-center gap-1.5 mt-4 -ml-1 px-1 py-1 text-xs font-semibold text-slate-900 hover:text-slate-600 transition-colors whitespace-nowrap"
      [attr.aria-label]="'certifications.viewCredentialFor' | transloco: { name: cert.name }"
      (click)="$event.stopPropagation()">
      <span>{{ 'certifications.viewCredential' | transloco }}</span>
      <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"
        aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path>
      </svg>
    </a>
    }
  </div>
  }
</div>

<!-- Hover modal overlay -->
@if (activeCert(); as cert) {
<div class="cert-overlay" aria-hidden="true">
  <div class="cert-overlay-panel" [style.left.px]="modalPosition().x" [style.top.px]="modalPosition().y">
    <div class="cert-overlay-inner">
      <img [src]="cert.imageUrl" [alt]="'certifications.certificateAlt' | transloco: { name: cert.name }"
        class="cert-overlay-img" loading="eager" decoding="async" width="1200" height="800" />
      <div class="cert-overlay-caption">
        <p class="text-sm font-semibold text-slate-100">{{ cert.name }}</p>
        <p class="text-xs text-slate-400">{{ cert.issuer }} · {{ cert.year }}</p>
      </div>
    </div>
  </div>
</div>
}
