<!-- Section cu fundal integrat fluid (Seamless Gradient Background) -->
<section id="hero" class="relative w-full overflow-hiddenpt-12">

  <!-- Ambient background glow central subtil -->
  <div class="pointer-events-none absolute left-1/2 top-0 -translate-x-1/2 h-64 w-full max-w-7xl blur-3xl">
  </div>

  <!-- Containerul de conținut aliniat cu restul paginii -->
  <div class="relative z-10 max-w-4xl mx-auto px-4 sm:px-6 text-center flex flex-col items-center">

    <!-- Status Badge -->
    <!-- Container de poziționare pentru Avatar + Badge -->
    <div class="relative inline-flex flex-col items-center mb-6">

      <!-- Badge-ul mutat deasupra și poziționat absolut -->
      <div
        class="absolute -top-3 z-10 inline-flex items-center gap-2 rounded-full bg-primary/10 backdrop-blur-md px-4 py-1.5 text-sm font-semibold text-secondary shadow-sm border border-white/40">
        <span class="h-2.5 w-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
        <span>Open for opportunities</span>
      </div>

      <!-- Imaginea de Avatar (60x60 = w-60 h-60) -->
      <img src="alex-rusu-avatar-image.png" alt="Alex George Rusu - Avatar"
        class="w-60 h-60 rounded-full object-cover shadow-lg border-4 border-white aspect-square" />

    </div>

    <!-- Name & Titles -->
    <div class="space-y-4 mb-10">
      <h1 class="max-w-3xl mx-auto text-4xl font-semibold tracking-tight text-slate-950 sm:text-5xl lg:text-6xl">
        Alex-George Rusu
      </h1>

      <p class="text-lg sm:text-xl font-medium text-slate-700 tracking-wide">
        Tech Lead Angular / Frontend
      </p>

      <p class="max-w-2xl mx-auto text-base leading-8 text-slate-600 sm:text-lg">
        {{ yearsOfExperience() }}+ years building performant, scalable web applications for
        <strong class="font-semibold text-primary">Porsche</strong>,
        <strong class="font-semibold text-primary">Daimler</strong>,
        <strong class="font-semibold text-primary">KUKA</strong> &amp; more. German &amp; English fluent.
      </p>
    </div>

  </div>

</section>
