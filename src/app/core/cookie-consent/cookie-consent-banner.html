@if (consent.bannerVisible()) {
<div class="fixed inset-x-0 bottom-0 z-[100] border-t border-slate-200 bg-white/98 backdrop-blur-xl shadow-[0_-8px_30px_rgba(15,23,42,0.08)]">
  <div class="mx-auto flex max-w-7xl flex-col gap-4 px-6 py-5 sm:flex-row sm:items-center sm:justify-between lg:px-8">
    <p class="text-sm leading-6 text-slate-600">
      {{ 'cookieConsent.message' | transloco }}
      <a [routerLink]="['/cookie-policy']" class="font-semibold text-primary underline underline-offset-2">{{ 'cookieConsent.cookiePolicyLink' | transloco }}</a>
      ·
      <a [routerLink]="['/privacy-policy']" class="font-semibold text-primary underline underline-offset-2">{{ 'cookieConsent.privacyPolicyLink' | transloco }}</a>
    </p>
    <div class="flex shrink-0 gap-3">
      <button type="button" (click)="consent.reject()"
        class="rounded-full border border-slate-300 px-5 py-2.5 text-sm font-semibold text-slate-700 transition hover:border-slate-400">
        {{ 'cookieConsent.rejectNonEssential' | transloco }}
      </button>
      <button type="button" (click)="consent.accept()"
        class="rounded-full bg-primary px-5 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:bg-slate-950">
        {{ 'cookieConsent.acceptAll' | transloco }}
      </button>
    </div>
  </div>
</div>
}
