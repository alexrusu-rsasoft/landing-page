@if (consent.bannerVisible()) {
<div #banner role="region" [attr.aria-label]="'cookieConsent.regionLabel' | transloco"
  class="fixed inset-x-0 bottom-0 z-[100] max-h-[70vh] overflow-y-auto border-t border-slate-200 bg-white/98 backdrop-blur-xl shadow-[0_-8px_30px_rgba(15,23,42,0.08)]"
  style="padding-bottom: env(safe-area-inset-bottom)">
  <div class="mx-auto flex max-w-7xl flex-col gap-3 px-6 py-4 sm:flex-row sm:items-center sm:justify-between sm:gap-4 sm:py-5 lg:px-8">
    <p class="text-xs leading-5 text-slate-600 sm:text-sm sm:leading-6">
      {{ 'cookieConsent.message' | transloco }}
      <a [routerLink]="['/cookie-policy']" class="font-semibold text-primary underline underline-offset-2">{{ 'cookieConsent.cookiePolicyLink' | transloco }}</a>
      ·
      <a [routerLink]="['/privacy-policy']" class="font-semibold text-primary underline underline-offset-2">{{ 'cookieConsent.privacyPolicyLink' | transloco }}</a>
    </p>
    <div class="flex shrink-0 gap-2 sm:gap-3">
      <button type="button" (click)="consent.reject()"
        class="rounded-full border border-slate-300 px-4 py-2 text-xs font-semibold text-slate-700 transition hover:border-slate-400 sm:px-5 sm:py-2.5 sm:text-sm">
        {{ 'cookieConsent.rejectNonEssential' | transloco }}
      </button>
      <button type="button" (click)="consent.accept()"
        class="rounded-full bg-primary px-4 py-2 text-xs font-semibold text-white shadow-sm transition hover:bg-slate-950 sm:px-5 sm:py-2.5 sm:text-sm">
        {{ 'cookieConsent.acceptAll' | transloco }}
      </button>
    </div>
  </div>
</div>
}
