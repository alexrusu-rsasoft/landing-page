services:
  - type: web
    name: landing-page
    runtime: static
    buildCommand: npm ci && npm run build -- --configuration production
    staticPublishPath: dist/landing-page/browser
    envVars:
      - key: NODE_VERSION
        value: 24.15.0
      - key: EXPERIENCE_API_URL
        sync: false
      - key: CAREERS_API_URL
        sync: false
      - key: DEVELOPER_PROFILES_API_URL
        sync: false
      - key: LEAD_MAGNET_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=()
      - path: /*
        name: Content-Security-Policy
        value: >-
          default-src 'self';
          script-src 'self' https://www.googletagmanager.com;
          style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
          font-src 'self' https://fonts.gstatic.com;
          img-src 'self' data:;
          connect-src 'self' https://script.google.com https://www.googletagmanager.com https://*.google-analytics.com https://*.analytics.google.com;
          frame-src https://calendar.google.com;
          frame-ancestors 'none';
          base-uri 'self';
          form-action 'self';
          object-src 'none'
