services:
  - type: web
    name: landing-page
    runtime: static
    buildCommand: npm ci && npm run build -- --configuration production
    staticPublishPath: dist/landing-page/browser
    envVars:
      - key: NODE_VERSION
        value: 24.15.0
      - key: EXPERIENCE_API_URL
        sync: false
      - key: CAREERS_API_URL
        sync: false
      - key: OFFERS_API_URL
        sync: false
      - key: DEVELOPER_PROFILES_API_URL
        sync: false
      - key: LEAD_MAGNET_API_URL
        sync: false
    routes:
      # Prerendered routes (dashboard, work-with-alex, contact, legal pages, ...)
      # are served directly as static files and never hit this rewrite. This
      # only catches paths with no prerendered file: the API-backed careers
      # routes and genuine 404s. It must point at the bare CSR shell rather
      # than the prerendered homepage — routing a mismatched URL to the
      # homepage's baked-in HTML causes a hydration mismatch (a flash of
      # homepage content) once the client Router resolves the real path.
      - type: rewrite
        source: /*
        destination: /index.csr.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=()
      - path: /*
        name: Content-Security-Policy
        value: >-
          default-src 'self';
          script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://tagmanager.google.com https://*.google-analytics.com https://*.googletagmanager.com;
          style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
          font-src 'self' https://fonts.gstatic.com;
          img-src 'self' data: https://listafirme.ro https://certificates.dev https://*.certificates.dev https://*.googleusercontent.com;
          connect-src 'self' https://ipwho.is https://script.google.com https://script.googleusercontent.com https://www.googletagmanager.com https://*.googletagmanager.com https://*.google-analytics.com https://*.analytics.google.com;
          frame-src 'self' https://calendar.google.com https://www.youtube-nocookie.com https://www.youtube.com;
          frame-ancestors 'none';
          base-uri 'self';
          form-action 'self';
          object-src 'none'
