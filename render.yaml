services:
  - type: web
    name: landing-page
    runtime: static
    buildCommand: npm ci && npm run build -- --configuration production
    staticPublishPath: dist/landing-page/browser
    envVars:
      - key: NODE_VERSION
        value: 24.15.0
      - key: EXPERIENCE_API_URL
        sync: false
      - key: CAREERS_API_URL
        sync: false
      - key: DEVELOPER_PROFILES_API_URL
        sync: false
      - key: LEAD_MAGNET_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
